<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>:root{color-scheme:light dark}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Hafta 1 · Yüklem Okuma</title>
</head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
/* Layout: tek sütunlu ders akışı; üstte sabit ilerleme şeridi, ekranlar dokundukça alta eklenir */
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --sunk:#EBEEF4; --ink:#18202F; --muted:#5A6375; --line:#D9DEE8;
  --accent:#2341B5; --accent-ink:#FFFFFF; --accent-soft:#E5EAFB;
  --ok:#137A3B; --ok-soft:#E1F4E7; --bad:#B8233A; --bad-soft:#FBE6EA;
  --g:#0E7268; --g-soft:#D7F0EB; --k:#A85008; --k-soft:#FBEAD2; --s:#6526C9; --s-soft:#EDE4FB;
  --xp:#8F5A04; --xp-soft:#FDF0C8;
  --d:#0369A1; --d-soft:#E0F2FE; --h:#BE185D; --h-soft:#FCE7F3; --c:#4D7C0F; --c-soft:#ECFCCB; --o:#4338CA; --o-soft:#E0E7FF; --oh:#A21CAF; --oh-soft:#FAE8FF; --i:#C2410C; --i-soft:#FFEDD5; --gi:#475569; --gi-soft:#E2E8F0;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E131D; --surface:#161D2B; --sunk:#1D2536; --ink:#E7EBF3; --muted:#9BA4B6; --line:#2B3448;
  --accent:#8EA3FF; --accent-ink:#0E131D; --accent-soft:#1E284D;
  --ok:#5BD98A; --ok-soft:#123220; --bad:#FF8597; --bad-soft:#3A1621;
  --g:#5FE0CC; --g-soft:#0E2F2B; --k:#F9B84A; --k-soft:#382710; --s:#C3B1FF; --s-soft:#271D47;
  --xp:#F8CF5B; --xp-soft:#352A0E;
  --d:#7DD3FC; --d-soft:#0C2A3D; --h:#F9A8D4; --h-soft:#3B1027; --c:#BEF264; --c-soft:#1F2C0B; --o:#A5B4FC; --o-soft:#1E1F4D; --oh:#F0ABFC; --oh-soft:#3A1240; --i:#FDBA74; --i-soft:#3A1F0B; --gi:#CBD5E1; --gi-soft:#243041;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E131D; --surface:#161D2B; --sunk:#1D2536; --ink:#E7EBF3; --muted:#9BA4B6; --line:#2B3448;
  --accent:#8EA3FF; --accent-ink:#0E131D; --accent-soft:#1E284D;
  --ok:#5BD98A; --ok-soft:#123220; --bad:#FF8597; --bad-soft:#3A1621;
  --g:#5FE0CC; --g-soft:#0E2F2B; --k:#F9B84A; --k-soft:#382710; --s:#C3B1FF; --s-soft:#271D47;
  --xp:#F8CF5B; --xp-soft:#352A0E;
  --d:#7DD3FC; --d-soft:#0C2A3D; --h:#F9A8D4; --h-soft:#3B1027; --c:#BEF264; --c-soft:#1F2C0B; --o:#A5B4FC; --o-soft:#1E1F4D; --oh:#F0ABFC; --oh-soft:#3A1240; --i:#FDBA74; --i-soft:#3A1F0B; --gi:#CBD5E1; --gi-soft:#243041;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:400 17px/1.62 var(--f-body);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}

/* üst şerit */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hud-in{max-width:680px;margin:0 auto;padding:10px 16px 8px;display:flex;align-items:center;gap:12px}
.hud-t{flex:1;min-width:0}
.hud-t b{display:block;font:800 15px/1.2 var(--f-display);letter-spacing:-.01em}
.hud-t span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xp-pill{flex:none;font:700 13px/1 var(--f-body);background:var(--xp-soft);color:var(--xp);padding:7px 11px;border-radius:999px;font-variant-numeric:tabular-nums}
.menu-b{flex:none;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.menu-b i{display:block;width:16px;height:2px;background:var(--ink);box-shadow:0 -5px 0 var(--ink),0 5px 0 var(--ink)}
.bar{height:4px;background:var(--sunk)}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .4s}

.menu{position:fixed;inset:0;z-index:40;background:rgba(10,14,22,.45);display:flex;justify-content:flex-end}
.menu-p{width:min(320px,86vw);height:100%;background:var(--surface);padding:calc(env(safe-area-inset-top,0px) + 18px) 18px 18px;overflow:auto;display:flex;flex-direction:column;gap:6px}
.menu-p h3{margin:0 0 8px;font:800 18px var(--f-display)}
.menu-p a{display:block;padding:10px 12px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:600}
.menu-p a.lock{color:var(--muted);pointer-events:none;font-weight:400}
.menu-p a:not(.lock):hover{background:var(--sunk)}
.menu-p .sp{flex:1}
.ghost{background:none;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;text-align:left}

/* akış */
main{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:8px 120px}
.screen{display:flex;flex-direction:column;gap:14px;padding-top:22px;scroll-margin-top:84px}
.screen+.screen{border-top:1px dashed var(--line);margin-top:22px}
p.say{margin:0;max-width:62ch}
.eb{font:700 12px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:6px 0 -6px}
h2.h{margin:0;font:800 clamp(26px,6vw,34px)/1.1 var(--f-display);letter-spacing:-.02em;text-wrap:balance}
h2.h.small{font-size:clamp(21px,5vw,25px)}
h2.h .cd{vertical-align:6px;margin-right:8px}

.hero{background:var(--accent);color:var(--accent-ink);border-radius:20px;padding:26px 22px 22px;display:flex;flex-direction:column;gap:10px;overflow:hidden;position:relative}
.hero small{font:700 12px var(--f-body);letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.hero h1{margin:0;font:800 clamp(34px,9vw,48px)/1 var(--f-display);letter-spacing:-.03em}
.hero p{margin:0;opacity:.9;max-width:40ch}
.hero .gks{display:flex;gap:8px;margin-top:6px}
.hero .gks span{font:800 15px var(--f-display);width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.16);background:color-mix(in srgb,var(--accent-ink) 16%,transparent)}

.en{font-weight:600}
.pr{font-weight:700;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.pr.g{color:var(--g)} .pr.k{color:var(--k)} .pr.s{color:var(--s)}
.sb{color:var(--accent)}
u{text-decoration-color:var(--bad);text-decoration-thickness:2px;text-underline-offset:4px}

/* kelime ve kod dokunmatikleri */
.gl{background:none;border:0;padding:0;font-weight:inherit;cursor:pointer;border-bottom:2px dotted var(--muted);line-height:1.2}
.gp,.cp{display:inline-block;font:600 13px/1.3 var(--f-body);background:var(--ink);color:var(--bg);border-radius:8px;padding:3px 8px;margin:0 4px;vertical-align:1px;animation:pop .15s ease-out}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.cd{display:inline-grid;place-items:center;min-width:28px;height:26px;padding:0 7px;border-radius:8px;border:0;font:800 14px/1 var(--f-display);cursor:pointer;vertical-align:1px}
.cd.g{background:var(--g-soft);color:var(--g)} .cd.k{background:var(--k-soft);color:var(--k)} .cd.s{background:var(--s-soft);color:var(--s)}
.cd.n{background:var(--sunk);color:var(--muted);cursor:default}

/* kod kartları */
.codes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.codes div{border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.codes .g{background:var(--g-soft)} .codes .k{background:var(--k-soft)} .codes .s{background:var(--s-soft)}
.codes b{font:800 26px/1 var(--f-display)}
.codes .g b{color:var(--g)} .codes .k b{color:var(--k)} .codes .s b{color:var(--s)}
.codes strong{font-size:14.5px;line-height:1.25}
.codes span{font-size:13px;color:var(--muted);line-height:1.35}
.codes em{font-style:normal;font-size:13px;font-weight:600;white-space:nowrap}
@media (max-width:460px){.codes{grid-template-columns:1fr}.codes div{display:grid;grid-template-columns:44px 1fr;column-gap:10px}.codes b{grid-row:span 3;align-self:center}}

/* örnek cümleler */
.ex{display:flex;flex-direction:column;gap:8px}
.ex .it{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.ex .it .cd{grid-row:span 2;align-self:start;margin-top:2px}
.ex .e{font-weight:600;min-width:0}
.ex .t{color:var(--muted);font-size:15px;min-width:0}

/* kimlik kartı */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card h4{margin:0;padding:11px 14px;font:800 17px var(--f-display);display:flex;align-items:center;gap:10px}
.card.g h4{background:var(--g-soft);color:var(--g)} .card.k h4{background:var(--k-soft);color:var(--k)} .card.s h4{background:var(--s-soft);color:var(--s)}
.card dl{margin:0;display:grid;grid-template-columns:96px 1fr}
.card dt,.card dd{margin:0;padding:9px 14px;border-top:1px solid var(--line);font-size:15px;min-width:0}
.card dt{font-weight:700;color:var(--muted);font-size:13.5px;padding-right:0}
.card dd small{display:block;color:var(--muted);font-size:14px;margin-top:2px}
@media (max-width:420px){.card dl{grid-template-columns:1fr}.card dd{border-top:0;padding-top:0}}

/* Türkçe-İngilizce eşleri */
.svgbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 10px;overflow:hidden}
.svgbox svg{width:100%;height:auto;display:block}
.pairs{display:flex;flex-direction:column;gap:6px}
.pairs div{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:15px}
.pairs div span:last-child{font-weight:500}
@media (max-width:460px){.pairs div{grid-template-columns:auto 1fr}.pairs div span:first-child{grid-column:1/-1;color:var(--muted)}}

/* soru */
.q{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.q .tag{align-self:flex-start;font:700 11.5px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--sunk);padding:4px 9px;border-radius:999px}
.q .ask{font-size:14.5px;color:var(--muted);margin:0}
.q .stem{font-size:18px;font-weight:600;line-height:1.5;margin:0}
.q .stem.trs{font-weight:500}
.q .stem.trs::before{content:"TR";font:800 11px var(--f-body);letter-spacing:.08em;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:2px 5px;margin-right:8px;vertical-align:2px}
.cebi{font-size:13.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px;margin:-4px 0 0}
.cebi::before{content:"Kelime cebi";font-weight:700;color:var(--ink)}
.cebi b{color:var(--ink);font-weight:600}
.opts{display:flex;flex-direction:column;gap:8px}
.op{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;cursor:pointer;transition:border-color .15s,background .15s;font-size:16px;line-height:1.45}
.op:hover:not([disabled]){border-color:var(--accent)}
.op .l{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font:800 13px var(--f-display);background:var(--sunk);color:var(--muted);margin-top:-1px}
.op .x{flex:1;min-width:0}
.op.wrong{border-color:var(--bad);background:var(--bad-soft)} .op.wrong .l{background:var(--bad);color:var(--surface)}
.op.right{border-color:var(--ok);background:var(--ok-soft)} .op.right .l{background:var(--ok);color:var(--surface)}
.op[disabled]{cursor:default}
.op.dim{opacity:.55}
.op .lt{flex:none;font:800 12px var(--f-display);color:var(--muted);border:1px dashed var(--line);border-radius:6px;padding:2px 6px;align-self:center}
.opts.codes3{flex-direction:row}
.opts.codes3 .op{flex:1 1 0;min-width:0;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:11px 6px;font-size:14px;line-height:1.25}
.opts.codes3 .op .cd{pointer-events:none}
.opts.who .op .l{width:auto;padding:0 9px;border-radius:999px;color:#fff}
.opts.who .op:nth-child(1) .l{background:#D6304F}.opts.who .op:nth-child(2) .l{background:#0B7FC0}.opts.who .op:nth-child(3) .l{background:#7A3AE0}
.opts.wire .op .l{width:34px;height:10px;border-radius:5px;margin-top:8px}
.opts.wire .op:nth-child(1) .l{background:#DC2626}.opts.wire .op:nth-child(2) .l{background:#2563EB}.opts.wire .op:nth-child(3) .l{background:#16A34A}
.opts.wire .op.right .l,.opts.wire .op.wrong .l{color:transparent}
.fb{border-radius:12px;padding:11px 13px;font-size:15.5px;line-height:1.55;display:flex;gap:10px;animation:pop .18s ease-out}
.fb::before{flex:none;font:800 13px/1 var(--f-display);width:24px;height:24px;border-radius:50%;display:grid;place-items:center;margin-top:1px}
.fb.ok{background:var(--ok-soft)} .fb.ok::before{content:"✓";background:var(--ok);color:var(--surface)}
.fb.no{background:var(--bad-soft)} .fb.no::before{content:"!";background:var(--bad);color:var(--surface)}
.fb.info{background:var(--accent-soft)} .fb.info::before{content:"i";background:var(--accent);color:var(--accent-ink)}
.fb .xpg{font-weight:700;color:var(--xp);white-space:nowrap}
.hintb{align-self:flex-start;background:none;border:1px dashed var(--accent);color:var(--accent);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:600;cursor:pointer}
.bomb .stem::before{content:"00:59";font:800 13px/1 ui-monospace,Menlo,monospace;color:var(--bad);margin-right:10px;letter-spacing:.06em}
.chat{background:var(--sunk);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px}
.bub{max-width:85%;background:var(--surface);border-radius:12px;padding:7px 11px;font-size:15.5px}
.bub b{display:block;font-size:12px;color:var(--g)}
.bub.me{align-self:flex-end;background:var(--accent-soft)}
.bub.gap{border:1.5px dashed var(--muted);background:transparent;color:var(--muted);text-align:center}

/* yüklem avı */
.toks{display:flex;flex-wrap:wrap;gap:6px}
.tk{border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:7px 11px;font-size:17px;font-weight:500;cursor:pointer}
.tk:hover:not([disabled]){border-color:var(--accent)}
.tk.miss{border-color:var(--bad);background:var(--bad-soft)}
.tk.hit{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);font-weight:700}
.tk.subj{border-color:transparent;color:var(--accent);background:var(--accent-soft)}
.tk[disabled]{cursor:default}

/* gerçek mi efsane mi */
.ge{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:0 4px}
.ge span{font-size:14.5px;color:var(--muted);margin-right:4px}
.ge button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 16px;font-weight:700;cursor:pointer}
.ge button.sel{border-color:var(--ink)}
.ge+.fb{margin-top:-6px}

/* kaydırmalı kart */
.sw{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.sw .e{font-weight:600;font-size:17px}
.sw .t{color:var(--muted)}
.sw .bt{display:flex;gap:10px}
.sw .bt button{flex:1;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);padding:10px;font-weight:700;cursor:pointer}
.sw .bt button.n{color:var(--bad)} .sw .bt button.y{color:var(--ok)}
.sw .bt button.sel.y{background:var(--ok-soft);border-color:var(--ok)} .sw .bt button.sel.n{background:var(--bad-soft);border-color:var(--bad)}
.sw .bt button.wr{background:var(--bad-soft);border-color:var(--bad)}

/* V2 kartları */
.v2{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.v2 button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 4px;cursor:pointer;font-size:15px;min-width:0}
.v2 button b{color:var(--k)}
@media (max-width:420px){.v2{grid-template-columns:repeat(3,minmax(0,1fr))}}

/* zaman şeridi */
.tl{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;overflow-x:auto}
.tl svg{display:block;width:100%;min-width:300px;height:auto}
.tl .ax{stroke:var(--muted)} .tl .ink{fill:var(--ink)} .tl .mut{fill:var(--muted)}
.tl .gb{fill:var(--g-soft);stroke:var(--g)} .tl .gt{fill:var(--g)}
.tl .kb{fill:var(--k-soft);stroke:var(--k)} .tl .kt{fill:var(--k)}
.tl .sbx{fill:var(--s-soft);stroke:var(--s)} .tl .st{fill:var(--s)}
.tl .now{stroke:var(--ink)}

/* adım adım çözüm */
.steps{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.steps .stem{margin:0;font-size:18px;font-weight:600;line-height:1.5}
.steps ol.so{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.steps ol.so li{display:flex;gap:10px;font-size:16px;padding:6px 8px;border-radius:10px}
.steps ol.so li b{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--sunk);color:var(--muted);font:800 13px var(--f-display)}
.steps ol.so li.mk{background:var(--ok-soft)} .steps ol.so li.mk b{background:var(--ok);color:var(--surface)}
.steps ol.so li.out{opacity:.5;text-decoration:line-through;text-decoration-thickness:1px}
.steps .st{display:flex;gap:10px;background:var(--accent-soft);border-radius:12px;padding:11px 13px;font-size:15.5px;animation:pop .18s ease-out}
.steps .st i{flex:none;font:800 13px var(--f-display);font-style:normal;color:var(--accent);margin-top:2px}

/* boss can barı */
.hp{display:flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--ink);border-radius:14px;padding:10px 14px;font:800 14px var(--f-display)}
.hp .b{flex:1;display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.hp .b i{height:14px;border-radius:4px;background:var(--bad);transition:opacity .3s,transform .3s}
.hp .b i.off{opacity:.15;transform:scaleY(.6)}

/* şifre kutuları */
.ci{display:flex;gap:8px;flex-wrap:wrap}
.ci span{width:44px;height:50px;border:2px solid var(--accent);border-radius:10px;display:grid;place-items:center;font:800 24px var(--f-display);color:var(--accent);background:var(--surface)}
.ci span.e{border-style:dashed;color:transparent}

/* kontrol noktası */
.chk{border:2px solid var(--accent);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:12px}
.chk .row{display:flex;gap:8px;flex-wrap:wrap}
.btn{align-self:flex-start;background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:13px 20px;font:700 16px var(--f-body);cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn::after{content:"→";font-weight:800}
.btn.sec{background:var(--surface);color:var(--accent);border:1.5px solid var(--accent)}
.btn.sec::after{content:none}
.btn[hidden]{display:none}

/* özet */
.sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.sum div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.sum b{font:800 26px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.sum span{font-size:13px;color:var(--muted)}
.sum .rk{grid-column:1/-1;background:var(--xp-soft);border-color:transparent}
.sum .rk b{color:var(--xp)}
.clist{display:flex;flex-direction:column;gap:8px}
.clist label{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:15.5px;cursor:pointer}
.clist input{width:20px;height:20px;margin-top:2px;accent-color:var(--ok);flex:none}
.clist span{flex:1;min-width:0}
.clist a{flex-basis:100%;margin-left:30px;font-size:13.5px;color:var(--accent);font-weight:600;text-decoration:none}
.login{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
.login label{font-weight:700;font-size:14.5px;margin-top:6px}
.login input{font:inherit;font-size:17px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.login input:focus{border-color:var(--accent);outline:none}
.login .btn{margin-top:10px}
.lgerr{margin:0;color:var(--bad);font-weight:600;font-size:14.5px}
.lgnote{margin:4px 0 0;color:var(--muted);font-size:13.5px}
.who-l{margin:0 0 10px;color:var(--muted);font-size:14px}

/* diğer kodlar (Aşama 2–5) */
.cd.d{background:var(--d-soft);color:var(--d)} .cd.h{background:var(--h-soft);color:var(--h)} .cd.c{background:var(--c-soft);color:var(--c)} .cd.o{background:var(--o-soft);color:var(--o)} .cd.oh{background:var(--oh-soft);color:var(--oh)} .cd.i{background:var(--i-soft);color:var(--i)} .cd.gi{background:var(--gi-soft);color:var(--gi)}

<script>
(function(){
'use strict';
/* Kodlar: STAGE.codes = {KOD:[cssSınıfı, ad, tense, Türkçe çekirdek, slogan]} — verilmezse G/K/S */
const CODES=STAGE.codes||{G:['g','Genel geçer','Present Simple','-r','"Hep böyle."'],K:['k','Kapanmış geçmiş','Past Simple','-dı','"Oldu, bitti, kapı kapandı."'],S:['s','Süren süreç','Present Continuous','-yor','"Bu aralar oluyor, değişiyor."']};
const CODE_RE=new RegExp('\\[('+Object.keys(CODES).sort((a,b)=>b.length-a.length).join('|')+')\\]','g');
const L='ABCDE';
const $=(s,r=document)=>r.querySelector(s);
const el=(tag,cls,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;};
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---- durum ---- */
let st=load()||fresh();
st.first=st.first||{};
function fresh(){return {scr:0,q:{},xp:{},ge:{},sw:{},tp:{},steps:{},chk:{},v2:{},cl:{},cipher:{},first:{},finished:false};}
function load(){try{const s=localStorage.getItem(STAGE.key);return s?JSON.parse(s):null;}catch(e){return null;}}
function save(){try{localStorage.setItem(STAGE.key,JSON.stringify(st));}catch(e){}report(false);}

/* ---- öğretmene rapor (yalnızca Google Apps Script'ten açılınca) ---- */
const GS=(typeof google!=='undefined'&&google.script&&google.script.run)?google.script.run:null;
/* Sayfa Google dışında (ör. GitHub Pages) barındırılınca kayıt bu adrese POST edilir (Apps Script doPost). */
const TRACK=(typeof TRACK_URL==='string'&&/^https:\/\/script\.google\.com\//.test(TRACK_URL))?TRACK_URL:null;
const TRACKED=!!(GS||TRACK);
function postTrack(p,onFail){
  const body=JSON.stringify(p);
  if(navigator.onLine===false){onFail();return;}
  try{fetch(TRACK,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body,keepalive:true}).then(()=>{retry=0;}).catch(onFail);}catch(e){onFail();}
}
let rT=null,lastSent='',retry=0;
function stats(){
  const scored=allQ().filter(q=>!q.cipher&&!q.noscore);
  const ids=scored.map(q=>q.id);
  const ans=ids.filter(id=>st.first[id]!==undefined);
  const cor=ans.filter(id=>st.first[id]===true).length;
  return {topic:STAGE.topic,study:STAGE.study,stage:STAGE.no,name:st.who&&st.who.name,email:st.who&&st.who.email,
    progress:Math.round(100*Math.min(st.scr,SCREENS.length-1)/(SCREENS.length-1)),
    finished:!!st.finished,answered:ans.length,correct:cor,total:ids.length};
}
function report(now){
  if(!TRACKED||!st.who)return;
  clearTimeout(rT);
  rT=setTimeout(()=>{const p=stats();const k=JSON.stringify(p);if(k===lastSent)return;lastSent=k;
    const fail=()=>{lastSent='';if(retry<5){retry++;setTimeout(()=>report(true),4000*retry);}};
    if(GS){try{GS.withFailureHandler(fail).withSuccessHandler(()=>{retry=0;}).kaydet(p);}catch(e){}}
    else postTrack(p,fail);},now?0:2500);
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')report(true);});
function firstTry(id,ok,noscore){if(!noscore&&st.first[id]===undefined)st.first[id]=!!ok;}

/* ---- metin biçimleme ---- */
function fmt(s){
  if(!s)return '';
  return s
    .replace(/\{([^|{}]+)\|([^{}]+)\}/g,(m,w,g)=>`<button type="button" class="gl" data-g="${g.replace(/"/g,'&quot;')}">${w}</button>`)
    .replace(CODE_RE,(m,c)=>`<button type="button" class="cd ${CODES[c][0]}" data-c="${c}">${c}</button>`)
    .replace(/<e>/g,'<span class="en">').replace(/<\/e>/g,'</span>')
    .replace(/<p(g|k|s|d|h|c|o|oh|i|gi)>/g,'<span class="pr $1">').replace(/<\/p(g|k|s|d|h|c|o|oh|i|gi)>/g,'</span>')
    .replace(/<sb>/g,'<span class="sb">').replace(/<\/sb>/g,'</span>');
}
function plain(s){return s.replace(/\{([^|{}]+)\|[^{}]+\}/g,'$1');}
function chip(c){return c?`<span class="cd ${CODES[c][0]}" aria-hidden="true">${c}</span>`:'';}
function cebi(str){
  if(!str)return null;
  const d=el('div','cebi');
  d.innerHTML=str.split(';').map(x=>{const [w,g]=x.split('|');return `<span><b>${w.trim()}</b> ${g.trim()}</span>`;}).join('');
  return d;
}

/* dokunmatik kelime ve kod açıklamaları (tek dinleyici) */
document.addEventListener('click',e=>{
  const g=e.target.closest('.gl');
  if(g){const n=g.nextElementSibling;if(n&&n.classList.contains('gp'))n.remove();else g.insertAdjacentHTML('afterend',`<span class="gp">${g.dataset.g}</span>`);return;}
  const c=e.target.closest('button.cd[data-c]');
  if(c){const n=c.nextElementSibling;if(n&&n.classList.contains('cp'))n.remove();else{const d=CODES[c.dataset.c];c.insertAdjacentHTML('afterend',`<span class="cp">${d[1]} · ${d[2]} · ${d[3]}</span>`);}}
});

/* ---- XP ---- */
let XPMAX=0;
function allQ(){const out=[];for(const s of SCREENS)for(const b of [...s.blocks,...(s.after||[])]){if(b.t==='mcq'||b.t==='tap'||b.t==='swipe')out.push(b);if(b.t==='check')out.push(...b.items);if(b.t==='cipher')out.push({id:b.id,xp:b.bonus,cipher:true});}return out;}
XPMAX=allQ().reduce((a,b)=>a+(b.xp||0),0);
function xpNow(){return Object.values(st.xp).reduce((a,b)=>a+b,0);}
function rank(){const r=xpNow()/XPMAX;let n=STAGE.ranks[0][1];for(const [t,name] of STAGE.ranks)if(r>=t)n=name;return n;}
function hud(){
  $('#hudXP').textContent=xpNow()+' XP';
  $('#hudBar').style.width=Math.round(100*Math.min(st.scr,SCREENS.length-1)/(SCREENS.length-1))+'%';
  let sec='';for(let i=st.scr;i>=0;i--){if(SCREENS[i].title){sec=SCREENS[i].title;break;}}
  $('#hudS').textContent=sec;
}
function award(id,n){if(st.xp[id]==null){st.xp[id]=n;}}

/* ---- ekranlar ---- */
const main=$('#main');
const screenObjs=[];
function renderScreen(i,scroll){
  const S=SCREENS[i];
  const sec=el('section','screen');sec.id='s'+i;
  if(S.sec&&(i===0||SCREENS[i-1].sec!==S.sec))sec.dataset.anchor=S.sec;
  const reqs=[];
  for(const b of S.blocks){const r=block(b,sec,()=>check());if(r&&r.req)reqs.push(r);}
  const afterBox=el('div');afterBox.style.cssText='display:contents';
  const nb=S.btn?el('button','btn',S.btn):null;
  if(nb){nb.type='button';nb.hidden=true;nb.onclick=()=>{nb.hidden=true;nb.remove();next(i);};}
  sec.appendChild(afterBox);if(nb)sec.appendChild(nb);
  main.appendChild(sec);
  let afterDone=false;
  function check(){
    if(!reqs.every(r=>r.done()))return;
    if(!afterDone){afterDone=true;for(const b of (S.after||[]))block(b,afterBox,()=>{});}
    if(nb&&st.scr===i)nb.hidden=false;
    if(i===SCREENS.length-1&&!st.finished){st.finished=true;save();report(true);}
    save();hud();
  }
  screenObjs[i]={sec,check};
  check();
  if(scroll)setTimeout(()=>sec.scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'}),40);
}
function next(i){if(st.scr===i){st.scr=i+1;save();report(true);}renderScreen(i+1,true);hud();menu();}

/* ---- blok çizerleri ---- */
function block(b,parent,changed){
  const f=B[b.t];if(!f){console.warn('bilinmeyen blok',b.t);return null;}
  return f(b,parent,changed);
}
const B={
 hero(b,p){p.appendChild(el('div','hero',`<small>${STAGE.kicker||'YDT Grammar · Self-study'}</small><h1>${STAGE.title.split('·').pop().trim()}</h1><p>${fmt(STAGE.hero||'')}</p><div class="gks">${(STAGE.heroCodes||Object.keys(CODES)).map(c=>`<span>${c}</span>`).join('')}</div>`));},
 say(b,p){p.appendChild(el('p','say',fmt(b.h)));},
 h(b,p){p.appendChild(el('div','eb',b.eb));p.appendChild(el('h2','h'+(b.small?' small':''),(b.code?`<button type="button" class="cd ${CODES[b.code][0]}" data-c="${b.code}">${b.code}</button>`:'')+b.h));},
 codes(b,p){p.appendChild(el('div','codes',(b.list||Object.keys(CODES)).map(c=>{const d=CODES[c];return `<div class="${d[0]}"><b>${c}</b><strong>${d[1]}</strong><span>${d[2]} · Türkçede çoğu zaman <em>${d[3]}</em></span>${d[4]?`<span>${d[4]}</span>`:''}</div>`;}).join('')));},
 ex(b,p){const d=el('div','ex');for(const [c,e,t] of b.items)d.appendChild(el('div','it',(c?`<button type="button" class="cd ${CODES[c][0]}" data-c="${c}">${c}</button>`:'<span class="cd n">?</span>')+`<div class="e">${fmt(e)}</div><div class="t">${fmt(t)}</div>`));p.appendChild(d);},
 card(b,p){p.appendChild(el('div','card '+CODES[b.code][0],`<h4>${chip(b.code)} ${b.title}</h4><dl>${b.rows.map(r=>`<dt>${r[0]}</dt><dd>${r[1]}${r[2]?`<small>${fmt(r[2])}</small>`:''}</dd>`).join('')}</dl>`));},
 svg(b,p){p.appendChild(el('div','svgbox',b.h));},
 pairs(b,p){p.appendChild(el('div','pairs',b.items.map(([tr,c,en])=>`<div><span>${tr}</span>${chip(c)}<span>${en}</span></div>`).join('')));},
 timeline(b,p){p.appendChild(el('div','tl',`<svg viewBox="0 0 640 150" role="img" aria-label="Zaman şeridi: G zamandan bağımsız, K 1800'lerde, S bu dönem">
  <rect class="gb" x="14" y="10" width="612" height="28" rx="14" stroke-width="1.5"/>
  <text class="gt" x="320" y="29" text-anchor="middle" font-size="14" font-weight="700">G · zamandan bağımsız: tilki gece avlanır</text>
  <line class="ax" x1="14" y1="95" x2="618" y2="95" stroke-width="2"/><polygon class="mut" points="628,95 616,89 616,101"/>
  <rect class="kb" x="70" y="78" width="180" height="34" rx="8" stroke-width="1.5"/>
  <text class="kt" x="160" y="100" text-anchor="middle" font-size="13.5" font-weight="700">K · in the 1800s</text>
  <rect class="sbx" x="380" y="78" width="200" height="34" rx="17" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text class="st" x="480" y="100" text-anchor="middle" font-size="13.5" font-weight="700">S · these days</text>
  <line class="now" x1="480" y1="64" x2="480" y2="122" stroke-width="2"/>
  <text class="ink" x="480" y="142" text-anchor="middle" font-size="13" font-weight="800">ŞİMDİ</text>
  <text class="mut" x="16" y="142" font-size="13">GEÇMİŞ</text><text class="mut" x="616" y="142" text-anchor="end" font-size="13">GELECEK</text></svg>`));},
 v2(b,p){const d=el('div','v2');for(const [a,v] of b.items){const bt=el('button','',a);bt.type='button';const k=a;const show=()=>{bt.innerHTML=`${a} → <b>${v}</b>`;};if(st.v2[k])show();bt.onclick=()=>{if(st.v2[k]){st.v2[k]=0;bt.textContent=a;}else{st.v2[k]=1;show();}save();};d.appendChild(bt);}p.appendChild(d);},

 mcq(b,p,changed,ctx){
  const box=el('div','q'+(b.bomb?' bomb':''));
  if(b.tag)box.appendChild(el('span','tag',b.tag));
  if(b.q)box.appendChild(el('p','ask',fmt(b.q)));
  if(b.chat){const c=el('div','chat');for(const [w,t] of b.chat){c.appendChild(el('div','bub'+(t==='----'?' me gap':''),t==='----'?`${w}: ----`:`<b>${w}</b>${fmt(t)}`));}box.appendChild(c);}
  if(b.stem)box.appendChild(el('p','stem'+(b.tr?' trs':''),fmt(b.stem)));
  const cb=cebi(b.cebi);if(cb)box.appendChild(cb);
  let hb=null;if(b.hint){hb=el('button','hintb','İpucu');hb.type='button';hb.onclick=()=>{hb.replaceWith(el('div','fb info',fmt(b.hint)));};box.appendChild(hb);}
  const opts=el('div','opts'+(b.codes?' codes3':'')+(b.who?' who':'')+(b.bomb?' wire':''));
  const list=b.codes?(Array.isArray(b.codes)?b.codes:['G','K','S']):b.o;
  const btns=list.map((o,i)=>{
    const bt=el('button','op');bt.type='button';
    let lab=b.who?['Ece','Mert','Defne'][i]:b.bomb?'':L[i];
    if(b.codes)bt.innerHTML=`<span class="cd ${CODES[o][0]}">${o}</span><span class="x">${CODES[o][1]}</span>`;
    else bt.innerHTML=`<span class="l">${lab}</span><span class="x">${fmt(plain(o))}</span>`+(b.L?`<span class="lt">${b.L[i]}</span>`:'');
    bt.onclick=()=>pick(i);opts.appendChild(bt);return bt;});
  box.appendChild(opts);
  const fbw=el('div');fbw.style.cssText='display:contents';box.appendChild(fbw);
  p.appendChild(box);
  const key=b.id;
  function rec(){return st.q[key]||(st.q[key]={tries:0,solved:false,wrong:[]});}
  function paint(showFb){
    const r=rec();
    btns.forEach((bt,i)=>{bt.classList.remove('right','wrong','dim');bt.disabled=false;
      if(r.wrong.includes(i))bt.classList.add('wrong');
      if(r.solved){bt.disabled=true;if(i===b.a)bt.classList.add('right');else if(!r.wrong.includes(i))bt.classList.add('dim');}});
    if(showFb!=null){fbw.innerHTML='';const ok=showFb===b.a;
      const xpTxt=ok&&r.tries===1&&b.xp&&!(ctx&&ctx.noxp)?` <span class="xpg">+${b.xp} XP</span>`:'';
      fbw.appendChild(el('div','fb '+(ok?'ok':'no'),`<div>${fmt(b.f[showFb])}${xpTxt}</div>`));}
  }
  function pick(i){
    const r=rec();if(r.solved)return;
    r.tries++;
    firstTry(key,i===b.a,b.noscore);
    if(i===b.a){r.solved=true;r.first=(r.tries===1);if(r.first&&b.xp&&!(ctx&&ctx.noxp))award(key,b.xp);}
    else if(!r.wrong.includes(i))r.wrong.push(i);
    paint(i);save();hud();changed();
    if(ctx&&ctx.onAnswer)ctx.onAnswer();
    document.dispatchEvent(new CustomEvent('qsolved',{detail:key}));
  }
  const r=rec();if(r.solved)paint(b.a);else if(r.wrong.length)paint(null);
  return {req:true,done:()=>!!rec().solved,reset:()=>{st.q[key]={tries:0,solved:false,wrong:[]};fbw.innerHTML='';paint(null);if(hb===null&&b.hint){}}};
 },

 tap(b,p,changed){
  const box=el('div','q');box.appendChild(el('p','ask',fmt(b.q)));
  const cb=cebi(b.cebi);
  const tk=el('div','toks');
  const groups=[...new Set(b.toks.map(t=>t[1]).filter(r=>r[0]==='p'))];
  const r=st.tp[b.id]||(st.tp[b.id]={found:[],tries:0,miss:0});
  const fbw=el('div');fbw.style.cssText='display:contents';
  const bts=b.toks.map(([w,role],i)=>{const bt=el('button','tk',w);bt.type='button';bt.onclick=()=>hit(i);tk.appendChild(bt);return bt;});
  box.appendChild(tk);if(cb)box.appendChild(cb);box.appendChild(fbw);p.appendChild(box);
  const done=()=>groups.every(g=>r.found.includes(g));
  function paint(){
    bts.forEach((bt,i)=>{const role=b.toks[i][1];bt.classList.toggle('hit',role[0]==='p'&&r.found.includes(role));if(done()){bt.disabled=true;if(role==='s')bt.classList.add('subj');bt.classList.remove('miss');}});
  }
  function say(cls,h){fbw.innerHTML='';fbw.appendChild(el('div','fb '+cls,`<div>${fmt(h)}</div>`));}
  function hit(i){
    if(done())return;const role=b.toks[i][1];r.tries++;
    firstTry(b.id,role[0]==='p');
    if(role[0]==='p'){if(!r.found.includes(role))r.found.push(role);
      if(done()){if(r.miss===0)award(b.id,b.xp);say('ok',b.done+(r.miss===0?` <span class="xpg">+${b.xp} XP</span>`:''));}
      else say('info',b.part||'Bi tane daha var.');}
    else{r.miss++;bts[i].classList.add('miss');setTimeout(()=>bts[i].classList.remove('miss'),900);say('no',role==='s'?b.fs:b.fo);}
    paint();save();hud();changed();
  }
  paint();if(done())say('ok',b.done);
  return {req:true,done};
 },

 ge(b,p,changed){
  const w=el('div','ge');w.appendChild(el('span','','Sence:'));
  const fbw=el('div');fbw.style.cssText='display:contents';
  const opts=[['G','Gerçek'],['E','Efsane']];
  const bts=opts.map(([k,t])=>{const bt=el('button','',t);bt.type='button';bt.onclick=()=>pick(k);w.appendChild(bt);return bt;});
  p.appendChild(w);p.appendChild(fbw);
  function show(k){bts.forEach((bt,i)=>{bt.disabled=true;bt.classList.toggle('sel',opts[i][0]===k);});
    fbw.innerHTML='';fbw.appendChild(el('div','fb '+(k===b.a?'ok':'info'),`<div>${k===b.a?'Tahminin tuttu. ':'Tahminin tutmadı, olsun. '}${fmt(b.fact)}</div>`));}
  function pick(k){if(st.ge[b.id])return;st.ge[b.id]=k;show(k);save();changed();}
  if(st.ge[b.id])show(st.ge[b.id]);
  return {req:true,done:()=>!!st.ge[b.id]};
 },

 swipe(b,p,changed){
  const c=el('div','sw',`<div class="e">${fmt(b.en)}</div>${b.tr?`<div class="t">${fmt(b.tr)}</div>`:''}`);
  const bt=el('div','bt');const no=el('button','n',b.noLabel||'✕ Geç');const yes=el('button','y',b.yesLabel||'♥ Eşleşme');no.type=yes.type='button';bt.append(no,yes);c.appendChild(bt);
  const fbw=el('div');fbw.style.cssText='display:contents';c.appendChild(fbw);p.appendChild(c);
  const r=()=>st.sw[b.id];
  function show(){const x=r();if(!x)return;
    no.classList.toggle('wr',x.wrong&&x.wrong.includes(false));yes.classList.toggle('wr',x.wrong&&x.wrong.includes(true));
    if(x.solved){no.disabled=yes.disabled=true;(b.a?yes:no).classList.add('sel');}
    fbw.innerHTML='';fbw.appendChild(el('div','fb '+(x.solved?'ok':'no'),`<div>${fmt(x.solved?b.ok:b.no)}${x.solved&&x.first?` <span class="xpg">+${b.xp} XP</span>`:''}</div>`));}
  function pick(v){const x=st.sw[b.id]||(st.sw[b.id]={tries:0,solved:false,wrong:[]});if(x.solved)return;x.tries++;firstTry(b.id,v===b.a);
    if(v===b.a){x.solved=true;x.first=x.tries===1;if(x.first)award(b.id,b.xp);}else x.wrong.push(v);
    show();save();hud();changed();}
  no.onclick=()=>pick(false);yes.onclick=()=>pick(true);show();
  return {req:true,done:()=>!!(r()&&r().solved)};
 },

 steps(b,p,changed){
  const box=el('div','steps');
  box.appendChild(el('p','stem',fmt(b.stem)));
  const ol=el('ol','so');b.o.forEach((o,i)=>ol.appendChild(el('li','',`<b>${L[i]}</b><span>${fmt(o)}</span>`)));box.appendChild(ol);
  const cb=cebi(b.cebi);if(cb)box.appendChild(cb);
  const out=el('div');out.style.cssText='display:flex;flex-direction:column;gap:8px';box.appendChild(out);
  const nb=el('button','btn sec','Sonraki adım');nb.type='button';box.appendChild(nb);p.appendChild(box);
  const n=()=>st.steps[b.id]||0;
  function paint(){out.innerHTML='';for(let i=0;i<n();i++)out.appendChild(el('div','st',`<i>${i+1}</i><div>${fmt(b.steps[i])}</div>`));
    const lis=ol.children;for(let i=0;i<lis.length;i++){lis[i].classList.remove('out','mk');}
    if(n()>=3){[0,2,3,4].filter(i=>i!==b.mark).forEach(i=>lis[i].classList.add('out'));}
    if(n()>=4)lis[b.mark].classList.add('mk');
    nb.hidden=n()>=b.steps.length;}
  nb.onclick=()=>{st.steps[b.id]=n()+1;paint();save();changed();};
  paint();
  return {req:true,done:()=>n()>=b.steps.length};
 },

 hp(b,p){const d=el('div','hp','BOSS<span class="b">'+b.ids.map(()=>'<i></i>').join('')+'</span>');p.appendChild(d);
  const f=()=>{const n=b.ids.filter(id=>st.q[id]&&st.q[id].solved).length;[...d.querySelectorAll('i')].forEach((x,i)=>x.classList.toggle('off',i<n));};
  f();liveFns.push(f);},

 cipher(b,p){const d=el('div','ci');const rv=el('div');rv.style.cssText='display:contents';p.appendChild(d);p.appendChild(rv);
  const qs={};for(const s of SCREENS)for(const x of s.blocks)if(x.t==='mcq'&&b.ids.includes(x.id))qs[x.id]=x;
  const f=()=>{d.innerHTML=b.ids.map(id=>{const q=qs[id];const ok=st.q[id]&&st.q[id].solved;return `<span class="${ok?'':'e'}">${ok?q.L[q.a]:'·'}</span>`;}).join('');
    const all=b.ids.every(id=>st.q[id]&&st.q[id].solved);
    if(all&&!rv.firstChild){award(b.id,b.bonus);save();rv.appendChild(el('div','fb ok',`<div>${fmt(b.reveal)}</div>`));$('#hudXP').textContent=xpNow()+' XP';}};
  f();liveFns.push(f);},

 check(b,p,changed){
  const box=el('div','chk');p.appendChild(box);
  const c=st.chk[b.id]||(st.chk[b.id]={round:1,result:null});
  const inner=el('div');inner.style.cssText='display:flex;flex-direction:column;gap:12px';box.appendChild(inner);
  const msg=el('div');msg.style.cssText='display:flex;flex-direction:column;gap:10px';box.appendChild(msg);
  let objs=[];
  function build(){inner.innerHTML='';objs=b.items.map(it=>B.mcq(it,inner,()=>{},{noxp:c.round>1,onAnswer:eval_}));}
  function eval_(){
    if(!b.items.every(it=>st.q[it.id]&&st.q[it.id].solved))return;
    if(c.result)return show();
    const n=b.items.filter(it=>st.q[it.id].tries===1).length;
    c.score=n;c.result=(n>=b.need)?'pass':(c.round>1?'done2':'fail');save();show();changed();}
  function show(){msg.innerHTML='';
    if(!c.result)return;
    const n=c.score;
    if(c.result==='pass'){msg.appendChild(el('div','fb ok',`<div><b>${n}/5.</b> ${fmt(c.round>1?b.pass2:b.pass)}</div>`));}
    else if(c.result==='done2'){msg.appendChild(el('div','fb info',`<div><b>${n}/5.</b> ${fmt(b.fail2)}</div>`));}
    else{msg.appendChild(el('div','fb no',`<div><b>${n}/5.</b> ${fmt(b.fail)}</div>`));
      const row=el('div','row');const back=el('button','btn sec',b.backLabel);back.type='button';
      back.onclick=()=>{const t=document.querySelector(`[data-anchor="${b.back}"]`);if(t)t.scrollIntoView({behavior:reduce?'auto':'smooth'});};
      const again=el('button','btn','Kontrolü baştan çöz');again.type='button';
      again.onclick=()=>{c.round=2;c.result=null;for(const it of b.items)st.q[it.id]={tries:0,solved:false,wrong:[]};save();build();show();box.scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'});};
      row.append(back,again);msg.appendChild(row);}
  }
  build();show();
  return {req:true,done:()=>c.result==='pass'||c.result==='done2'};
 },

 summary(b,p){const d=el('div','sum');p.appendChild(d);
  const f=()=>{const all=allQ().filter(q=>q.xp&&!q.cipher);const first=all.filter(q=>st.xp[q.id]!=null).length;
    d.innerHTML=`<div><b>${xpNow()}</b><span>/ ${XPMAX} XP</span></div><div><b>${first}</b><span>soru ilk denemede</span></div><div><b>${Math.round(100*xpNow()/XPMAX)}%</b><span>başarı</span></div><div class="rk"><span>Rütben</span><b>${rank()}</b><span>${rankNote()}</span></div>`;};
  f();liveFns.push(f);},
 checklist(b,p){const d=el('div','clist');b.items.forEach(([t,a],i)=>{const lb=el('label','',`<input type="checkbox" id="cl${i}"><span>${t}</span><a href="#" data-go="${a}">bölüme dön</a>`);
   const inp=lb.querySelector('input');inp.checked=!!st.cl[i];inp.onchange=()=>{st.cl[i]=inp.checked?1:0;save();};
   lb.querySelector('a').onclick=e=>{e.preventDefault();go(a);};d.appendChild(lb);});p.appendChild(d);},
 restart(b,p){const bt=el('button','btn sec','Aşamayı baştan çöz');bt.type='button';let arm=false;
   bt.onclick=()=>{if(!arm){arm=true;bt.textContent='Emin misin? Bütün cevaplar silinir. Tekrar dokun.';return;}reset();};p.appendChild(bt);}
};
const liveFns=[];
function rankNote(){const r=rank();const d={'Çaylak':'Olsun, ilk tur bu. Tuzak bölümlerine bi daha bak.','Zaman Yolcusu':'Fena değil. Bi tur daha atarsan dedektif olursun.','Zaman Dedektifi':'Çok iyi. KRONOS\'a az kaldı.','KRONOS':'Zamanın efendisi sensin.'};return (STAGE.rankNotes&&STAGE.rankNotes[r])||d[r]||'';}
const _hud=hud;hud=function(){_hud();liveFns.forEach(f=>f());};

/* ---- menü ---- */
function menu(){
  const nav=$('#menuNav');nav.innerHTML='';const seen=new Set();
  if(st.who)nav.appendChild(el('p','who-l','Öğrenci: <b></b>')).querySelector('b').textContent=st.who.name;
  SCREENS.forEach((s,i)=>{if(!s.title||seen.has(s.sec))return;seen.add(s.sec);
    const a=el('a',i<=st.scr?'':'lock',s.title);a.href='#';a.onclick=e=>{e.preventDefault();closeMenu();go(s.sec);};nav.appendChild(a);});
}
function go(sec){const t=document.querySelector(`[data-anchor="${sec}"]`);if(t)t.scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'});}
function closeMenu(){$('#menu').hidden=true;}
$('#menuB').onclick=()=>{menu();$('#menu').hidden=false;};
$('#menu').addEventListener('click',e=>{if(e.target.id==='menu')closeMenu();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu();});
let armR=false;$('#resetB').onclick=()=>{if(!armR){armR=true;$('#resetB').textContent='Emin misin? Tekrar dokun.';return;}reset();};
function reset(){const w=st.who;st=fresh();st.who=w;save();location.hash='';main.innerHTML='';liveFns.length=0;boot(true);closeMenu();armR=false;$('#resetB').textContent='Baştan başla';window.scrollTo(0,0);}

/* ---- başlat ---- */
function gate(){
  const box=el('section','screen');
  box.innerHTML=`<div class="hero"><small>${STAGE.kicker||'YDT Grammar · Self-study'}</small><h1>${STAGE.title.split('·').pop().trim()}</h1><p>Başlamadan önce kendini tanıt. Hocan ilerlemeni bu bilgilerle görecek.</p></div>
  <form class="login" id="lg" novalidate>
    <label for="lgN">Adın soyadın</label><input id="lgN" autocomplete="name" required maxlength="80">
    <label for="lgE">E-posta adresin</label><input id="lgE" type="email" autocomplete="email" inputmode="email" required maxlength="120">
    <p class="lgerr" id="lgX" hidden></p>
    <button class="btn" type="submit">Derse başla</button>
    <p class="lgnote">Aynı telefonla açtığın sürece kaldığın yerden devam edersin.</p>
  </form>`;
  main.appendChild(box);
  $('#lg').addEventListener('submit',e=>{e.preventDefault();
    const n=$('#lgN').value.trim(),m=$('#lgE').value.trim().toLowerCase();
    const x=$('#lgX');
    if(n.length<3){x.textContent='Adını ve soyadını yaz.';x.hidden=false;return;}
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(m)){x.textContent='E-posta adresini kontrol et, bi harf eksik gibi.';x.hidden=false;return;}
    st.who={name:n,email:m};save();box.remove();boot();report(true);});
}
function boot(){
  if(TRACKED&&!st.who){$('#hudT').textContent=STAGE.title;gate();return;}
  $('#hudT').textContent=STAGE.title;
  const upto=Math.min(st.scr,SCREENS.length-1);
  for(let i=0;i<=upto;i++)renderScreen(i,false);
  hud();menu();
  if(upto>0){const t=document.getElementById('s'+upto);if(t)setTimeout(()=>t.scrollIntoView({block:'start'}),60);}
}
boot();
})();

</script>

</body></html>
